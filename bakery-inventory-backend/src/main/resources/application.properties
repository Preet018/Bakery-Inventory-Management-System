spring.application.name=bakery-inventory-management

spring.datasource.url=jdbc:mysql://localhost:3306/bakery_inventory
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#spring.security.user.name=${SECURITY_USER}
#spring.security.user.password=${SECURITY_PASSWORD}

spring.main.banner-mode=off
