spring.application.name=bakery-inventory-management

spring.datasource.url=jdbc:mysql://localhost:3306/bakery_inventory
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


app.upload.dir=uploads/images/products

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB


razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

app.admin.username=${ADMIN_USERNAME}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}


spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

jwt.secret=${JWT_SECRET}

# Default = 15 minutes.
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}


#spring.security.user.name=${SECURITY_USER}
#spring.security.user.password=${SECURITY_PASSWORD}


spring.main.banner-mode=off
