spring.application.name=bakery-inventory-management

spring.datasource.url=jdbc:mysql://localhost:3306/bakery_inventory
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


app.upload.dir=uploads/images/products

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB


razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

#spring.security.user.name=${SECURITY_USER}
#spring.security.user.password=${SECURITY_PASSWORD}


spring.main.banner-mode=off
